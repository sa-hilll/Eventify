<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eventify — Campus Event Management & Pass Booking</title>
<meta name="description" content="Discover, RSVP, waitlist, and manage college and campus events in high-contrast cinematic dark mode.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Ultra-Premium Obsidian & Ultraviolet Palette */
  --bg-main: #090a0f;
  --bg-surface: #11131c;
  --bg-card: #161826;
  --bg-card-hover: #1e2032;
  --bg-input: #1a1d2d;
  --bg-input-focus: #21253b;
  --bg-glass: rgba(17, 19, 28, 0.85);
  
  --primary: #8b5cf6;
  --primary-hover: #7c3aed;
  --primary-glow: rgba(139, 92, 246, 0.45);
  --primary-light: #ede9fe;
  
  --accent-pink: #f43f5e;
  --accent-orange: #fb923c;
  --accent-amber: #f59e0b;
  --accent-cyan: #06b6d4;
  --accent-emerald: #10b981;
  --accent-rose: #f43f5e;
  
  /* High Contrast Typography */
  --tx-title: #ffffff;
  --tx-body: #f1f5f9;
  --tx-muted: #cbd5e1;
  --tx-dim: #94a3b8;
  
  --bd-card: rgba(255, 255, 255, 0.1);
  --bd-card-strong: rgba(255, 255, 255, 0.16);
  --bd-focus: rgba(139, 92, 246, 0.6);
  
  --radius-xl: 18px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --radius-full: 9999px;
  
  --shadow-card: 0 12px 36px -10px rgba(0, 0, 0, 0.75);
  --shadow-glow: 0 0 30px -5px rgba(139, 92, 246, 0.4);
  
  --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-heading: 'Outfit', 'Plus Jakarta Sans', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--bg-main);
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.15) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(244, 63, 94, 0.1) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
  background-attachment: fixed;
  color: var(--tx-body);
  font-family: var(--font-main);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Typography ── */
h1, h2, h3, h4 {
  font-family: var(--font-heading);
  color: var(--tx-title);
  letter-spacing: -0.02em;
  font-weight: 800;
}
p, span, label { color: var(--tx-body); }
button, input, textarea { font-family: inherit; }

/* ── Top Navbar ── */
.top-nav {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 40px;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--bd-card);
}
.brand-logo {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-heading); font-size: 23px; font-weight: 900;
  color: #fff; letter-spacing: 0.06em; text-transform: uppercase;
}
.brand-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #8b5cf6, #f43f5e);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 18px rgba(139, 92, 246, 0.45);
  color: #fff;
}

.nav-center-menu {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255, 255, 255, 0.06);
  padding: 5px 8px; border-radius: var(--radius-full);
  border: 1px solid var(--bd-card);
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 18px; border-radius: var(--radius-full);
  font-size: 14px; font-weight: 700; color: var(--tx-muted);
  cursor: pointer; transition: all 0.2s ease; border: 0; background: none;
}
.nav-item:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
.nav-item.active {
  background: #ffffff; color: #090a0f; font-weight: 800;
  box-shadow: 0 2px 14px rgba(255, 255, 255, 0.25);
}
.nav-item-icon-only {
  width: 38px; height: 38px; border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  color: var(--tx-muted); cursor: pointer; transition: all 0.2s ease;
  position: relative; border: 0; background: none;
}
.nav-item-icon-only:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
.badge-count {
  position: absolute; top: 4px; right: 4px;
  background: #ef4444; color: #fff; font-size: 10px; font-weight: 900;
  padding: 1px 6px; border-radius: 10px; border: 2px solid var(--bg-main);
}

.nav-right-actions { display: flex; align-items: center; gap: 14px; }
.user-pill {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-card); border: 1px solid var(--bd-card-strong);
  padding: 6px 16px 6px 8px; border-radius: var(--radius-full);
}
.avatar-circle {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #8b5cf6, #ec4899);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 13px; color: #fff;
}
.user-name { font-size: 14px; font-weight: 700; color: #ffffff; }
.role-badge {
  font-size: 11px; font-weight: 900; text-transform: uppercase;
  background: rgba(139, 92, 246, 0.25); color: #ddd6fe;
  padding: 3px 9px; border-radius: 6px; border: 1px solid rgba(139, 92, 246, 0.45);
}

/* ── Auth Page ── */
.auth-page {
  display: grid; grid-template-columns: 1.15fr 0.85fr;
  min-height: 100vh; background: #07080c;
}
@media (max-width: 960px) {
  .auth-page { grid-template-columns: 1fr; }
  .auth-gallery { display: none; }
}
.auth-gallery {
  padding: 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
  height: 100vh; overflow: hidden; position: relative;
}
.auth-gallery::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 55%, #07080c 100%);
  pointer-events: none;
}
.poster-card-col { display: flex; flex-direction: column; gap: 20px; }
.poster-card-col.col-offset { transform: translateY(-50px); }
.poster-card-col.col-down { transform: translateY(40px); }
.gallery-poster {
  border-radius: var(--radius-lg); overflow: hidden;
  height: 250px; background-size: cover; background-position: center;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
  position: relative; transition: transform 0.4s ease;
}
.gallery-poster:hover { transform: scale(1.03); }
.gallery-poster::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.85) 100%);
}
.gallery-poster-title {
  position: absolute; bottom: 14px; left: 14px; right: 14px; z-index: 2;
  font-size: 14px; font-weight: 800; color: #ffffff; text-shadow: 0 2px 8px rgba(0,0,0,0.9);
}

.auth-form-side {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 24px; position: relative; z-index: 10;
}
.auth-box {
  width: 100%; max-width: 450px;
  background: var(--bg-surface); color: var(--tx-body);
  border-radius: var(--radius-xl); padding: 42px 36px;
  border: 1px solid var(--bd-card-strong);
  box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.9), 0 0 50px rgba(139, 92, 246, 0.18);
}
.auth-box h1 {
  font-size: 28px; font-weight: 900; color: #ffffff; margin-bottom: 8px;
  text-align: center;
}
.auth-box .auth-subtitle {
  font-size: 14px; color: var(--tx-muted); text-align: center; margin-bottom: 26px;
}
.auth-brand-head {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-heading); font-size: 22px; font-weight: 900;
  color: #ffffff; letter-spacing: 0.06em; margin-bottom: 24px;
}
.auth-tabs {
  display: flex; background: var(--bg-card); border-radius: var(--radius-md);
  padding: 4px; margin-bottom: 24px; border: 1px solid var(--bd-card);
}
.auth-tab-btn {
  flex: 1; padding: 10px; border: 0; background: none; border-radius: var(--radius-sm);
  font-size: 13.5px; font-weight: 800; color: var(--tx-muted); cursor: pointer; transition: all 0.2s ease;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.auth-tab-btn.active {
  background: var(--primary); color: #ffffff;
  box-shadow: 0 2px 10px rgba(139, 92, 246, 0.4);
}

.form-field { margin-bottom: 18px; }
.form-field label {
  display: block; font-size: 12.5px; font-weight: 800; color: var(--tx-body);
  margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.04em;
}
.input-wrap { position: relative; }
.input-wrap input {
  width: 100%; padding: 13px 16px; font-size: 14.5px; font-family: inherit; font-weight: 600;
  border-radius: var(--radius-md); border: 1.5px solid var(--bd-card-strong); background: var(--bg-input);
  color: #ffffff; transition: all 0.2s ease;
}
.input-wrap input::placeholder { color: var(--tx-dim); }
.input-wrap input:focus {
  outline: none; border-color: var(--primary); background: var(--bg-input-focus);
  box-shadow: 0 0 0 4px var(--primary-glow);
}
.pass-toggle-btn {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: 0; color: var(--tx-muted); cursor: pointer; padding: 4px; display: flex;
}
.pass-toggle-btn:hover { color: #ffffff; }

.strength-bar-wrap { display: flex; gap: 5px; margin-top: 8px; margin-bottom: 4px; }
.strength-seg { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; transition: background 0.3s ease; }
.strength-text { font-size: 11.5px; font-weight: 700; color: var(--tx-muted); margin-bottom: 12px; }

.admin-code-callout {
  background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.35); border-radius: var(--radius-md);
  padding: 10px 14px; font-size: 13px; color: #ddd6fe; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px; font-weight: 700;
}

.submit-btn {
  width: 100%; padding: 14px; border-radius: var(--radius-md); border: 0;
  background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
  color: #ffffff; font-size: 15px; font-weight: 800; cursor: pointer;
  transition: all 0.25s ease; box-shadow: 0 6px 18px rgba(139, 92, 246, 0.4);
  display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;
}
.submit-btn:hover {
  background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
  box-shadow: 0 8px 24px rgba(139, 92, 246, 0.55); transform: translateY(-1px);
}
.submit-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

.auth-error {
  color: #f87171; font-size: 13px; font-weight: 700; min-height: 20px;
  margin-top: 10px; text-align: center;
}
.auth-switch {
  margin-top: 22px; font-size: 14px; color: var(--tx-muted); text-align: center;
}
.auth-switch button {
  background: none; border: 0; color: var(--primary); font-weight: 800;
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}

/* ── Main Layout ── */
.app-container {
  max-width: 1440px; margin: 0 auto; padding: 28px 40px 60px 40px;
}
.main-split-layout {
  display: grid; grid-template-columns: 1fr 340px; gap: 36px; align-items: start;
}
@media (max-width: 1100px) {
  .main-split-layout { grid-template-columns: 1fr; }
}

/* ── Category Chips & Search Bar ── */
.search-filter-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; margin-bottom: 26px; flex-wrap: wrap;
}
.category-chips-list {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none;
}
.category-chips-list::-webkit-scrollbar { display: none; }
.cat-chip {
  padding: 9px 20px; border-radius: var(--radius-full);
  background: var(--bg-surface); border: 1px solid var(--bd-card);
  color: var(--tx-muted); font-size: 13.5px; font-weight: 700;
  cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
}
.cat-chip:hover { color: #fff; background: var(--bg-card-hover); border-color: rgba(255,255,255,0.25); }
.cat-chip.active {
  background: #ffffff; color: #090a0f; font-weight: 900; border-color: #ffffff;
  box-shadow: 0 4px 16px rgba(255, 255, 255, 0.3);
}

.search-input-pill { position: relative; min-width: 290px; }
.search-input-pill input {
  width: 100%; padding: 10px 16px 10px 42px;
  background: var(--bg-surface); border: 1.5px solid var(--bd-card-strong);
  border-radius: var(--radius-full); color: #fff; font-size: 14px; font-weight: 600;
  transition: all 0.2s ease;
}
.search-input-pill input::placeholder { color: var(--tx-dim); }
.search-input-pill input:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow); background: var(--bg-card);
}
.search-input-pill .search-icon {
  position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
  color: var(--tx-muted); pointer-events: none;
}

/* ── Poster Card Grid ── */
.section-heading-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; margin-top: 6px;
}
.section-title {
  font-size: 21px; font-weight: 800; color: #ffffff;
  display: flex; align-items: center; gap: 10px;
}
.section-count { font-size: 13.5px; font-weight: 700; color: var(--tx-muted); }

.posters-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 24px 20px; margin-bottom: 40px;
}
@media (max-width: 640px) {
  .posters-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
}

.event-poster-card {
  display: flex; flex-direction: column; cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.event-poster-card:hover { transform: translateY(-7px); }
.event-poster-art {
  position: relative; width: 100%; aspect-ratio: 2/3;
  border-radius: var(--radius-lg); overflow: hidden;
  background: var(--bg-card); background-size: cover; background-position: center;
  border: 1px solid var(--bd-card-strong); box-shadow: var(--shadow-card);
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
.event-poster-card:hover .event-poster-art {
  border-color: rgba(139, 92, 246, 0.7);
  box-shadow: 0 16px 32px -6px rgba(139, 92, 246, 0.4);
}

.event-poster-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.15) 30%, rgba(9, 10, 15, 0.95) 100%);
  display: flex; flex-direction: column; justify-content: space-between; padding: 12px;
}
.card-top-tags {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 6px;
}
.pill-badge {
  font-size: 10.5px; font-weight: 900; padding: 4px 9px; border-radius: var(--radius-full);
  backdrop-filter: blur(10px); text-transform: uppercase; letter-spacing: 0.04em;
}
.pill-badge.hot {
  background: rgba(244, 63, 94, 0.95); color: #fff; box-shadow: 0 2px 10px rgba(244, 63, 94, 0.5);
}
.pill-badge.seats {
  background: rgba(15, 23, 42, 0.9); color: #f8fafc; border: 1px solid rgba(255,255,255,0.2);
}
.pill-badge.full { background: rgba(220, 38, 38, 0.9); color: #fff; }
.pill-badge.confirmed { background: #059669; color: #fff; box-shadow: 0 2px 10px rgba(16, 185, 129, 0.5); }
.pill-badge.wait { background: #d97706; color: #fff; box-shadow: 0 2px 10px rgba(245, 158, 11, 0.5); }

.card-bottom-actions {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.card-quick-btn {
  flex: 1; padding: 8px 12px; border-radius: var(--radius-sm); border: 0;
  background: #ffffff; color: #090a0f; font-size: 12px; font-weight: 900;
  cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 5px;
}
.card-quick-btn:hover { background: var(--primary); color: #fff; }
.card-quick-btn.booked { background: #10b981; color: #fff; }
.card-quick-btn.waitlist-btn { background: #f59e0b; color: #090a0f; }
.card-quick-btn.waitlist-btn:hover { background: #d97706; color: #fff; }

.card-star-btn {
  width: 34px; height: 34px; border-radius: var(--radius-sm); border: 0;
  background: rgba(255, 255, 255, 0.18); color: #fff; backdrop-filter: blur(8px);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}
.card-star-btn:hover { background: rgba(255, 255, 255, 0.35); }
.card-star-btn.active { background: #f59e0b; color: #090a0f; }

.event-info-box { padding: 12px 2px 2px 2px; }
.event-name {
  font-size: 15.5px; font-weight: 800; color: #ffffff; line-height: 1.35;
  margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}
.event-sub-meta {
  font-size: 13px; font-weight: 600; color: var(--tx-muted); display: flex; align-items: center; gap: 8px;
}

/* ── Right Sidebar ── */
.sidebar-panel { display: flex; flex-direction: column; gap: 24px; }

.info-widget-card {
  background: var(--bg-surface); border: 1px solid var(--bd-card-strong);
  border-radius: var(--radius-xl); padding: 22px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
}
.widget-header {
  font-size: 15px; font-weight: 800; color: #ffffff;
  margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
}
.widget-desc {
  font-size: 13px; line-height: 1.55; color: var(--tx-muted); font-weight: 500;
}

.leaderboard-card {
  background: var(--bg-surface); border: 1px solid var(--bd-card-strong);
  border-radius: var(--radius-xl); padding: 22px;
}
.leaderboard-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
}
.leaderboard-title {
  font-size: 17px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px;
}
.timeframe-pill {
  font-size: 12px; font-weight: 800; color: var(--tx-muted);
  background: var(--bg-card); padding: 4px 12px; border-radius: var(--radius-full);
  border: 1px solid var(--bd-card);
}

.leaderboard-list { display: flex; flex-direction: column; gap: 16px; }
.leaderboard-item {
  display: flex; align-items: center; gap: 14px; padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.leaderboard-item:last-child { border-bottom: none; }
.rank-num {
  font-family: var(--font-heading); font-size: 34px; font-weight: 900;
  color: #475569; line-height: 1; width: 30px; text-align: center;
}
.rank-num.rank-1 { color: #fbbf24; }
.rank-num.rank-2 { color: #cbd5e1; }
.rank-num.rank-3 { color: #d97706; }

.rank-thumb {
  width: 48px; height: 66px; border-radius: var(--radius-sm);
  background-size: cover; background-position: center; flex-shrink: 0;
  border: 1px solid var(--bd-card-strong);
}
.rank-meta { flex: 1; min-width: 0; }
.rank-name {
  font-size: 14px; font-weight: 800; color: #ffffff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;
}
.rank-date { font-size: 12px; font-weight: 600; color: var(--tx-muted); margin-bottom: 5px; }
.rank-hype { font-size: 12px; font-weight: 800; color: #fb923c; display: flex; align-items: center; gap: 5px; }

/* ── Modal Manager ── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal-window {
  background: #131522; border: 1px solid var(--bd-card-strong);
  border-radius: var(--radius-xl); width: 100%; max-width: 620px;
  max-height: 90vh; overflow-y: auto; padding: 30px;
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 50px rgba(139, 92, 246, 0.25);
  color: #fff; position: relative;
}
.modal-close-btn {
  position: absolute; top: 20px; right: 20px;
  background: var(--bg-card); border: 1px solid var(--bd-card-strong);
  color: var(--tx-muted); width: 34px; height: 34px; border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}
.modal-close-btn:hover { color: #fff; background: var(--bg-card-hover); }

/* Tabs inside Modal */
.modal-tabs-bar {
  display: flex; gap: 10px; border-bottom: 1px solid var(--bd-card);
  padding-bottom: 14px; margin-bottom: 22px;
}
.modal-tab-btn {
  background: none; border: 0; padding: 8px 16px; border-radius: var(--radius-sm);
  color: var(--tx-muted); font-size: 14px; font-weight: 800; cursor: pointer;
  transition: all 0.2s ease;
}
.modal-tab-btn.active {
  background: rgba(139, 92, 246, 0.25); color: #ddd6fe; border: 1px solid rgba(139, 92, 246, 0.5);
}

/* ── API Client ── */
async function api(p, m, b) {
  m = m || 'GET';
  var r = await fetch('/api' + p, {
    method: m,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: b ? JSON.stringify(b) : undefined
  });
  var d = await r.json().catch(function(){ return {}; });
  if (!r.ok) {
    if (r.status === 401 && token) logout();
    throw new Error(d.error || 'Something went wrong');
  }
  return d;
}

function toast(msg, isErr) {
  var t = document.createElement('div');
  t.className = 'toast-notice' + (isErr ? ' err' : '');
  t.innerHTML = (isErr ? icons.close : icons.check) + ' ' + esc(msg);
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}

function logout() {
  localStorage.clear();
  token = me = null;
  render();
}

function render() {
  if (!me) renderAuth();
  else renderMain();
}

          '<div class="auth-tabs">' +
            '<button type="button" class="auth-tab-btn ' + (authRole === 'student' ? 'active' : '') + '" onclick="setAuthRole(\'student\')">' + icons.user + ' Student</button>' +

          '</div>' +
          '<form onsubmit="handleAuthSubmit(event)">' +
            (reg ? '<div class="form-field"><label>Full Name</label><div class="input-wrap"><input name="fullname" placeholder="Alex Morgan" required></div></div>' : '') +
            '<div class="form-field"><label>Email Address</label><div class="input-wrap"><input name="email" type="email" placeholder="alex@campus.edu" required></div></div>' +

function setAuthMode(m) { authMode = m; renderAuth(); }
function setAuthRole(r) { authRole = r; renderAuth(); }
function togglePass() {
  showPass = !showPass;
  var inp = $('#pass-inp');
  if (inp) inp.type = showPass ? 'text' : 'password';
}
function checkStrength(v) {
  var s1 = $('#str-1'), s2 = $('#str-2'), s3 = $('#str-3'), s4 = $('#str-4'), lbl = $('#str-label');
  if (!s1) return;
  var score = 0;
  if (v.length >= 6) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;

  var colors = ['rgba(255,255,255,0.1)', '#ef4444', '#f59e0b', '#10b981', '#8b5cf6'];
  var labels = ['Too weak', 'Weak', 'Fair', 'Strong', 'Very strong'];
  s1.style.background = score >= 1 ? colors[score] : 'rgba(255,255,255,0.1)';
  s2.style.background = score >= 2 ? colors[score] : 'rgba(255,255,255,0.1)';
  s3.style.background = score >= 3 ? colors[score] : 'rgba(255,255,255,0.1)';
  s4.style.background = score >= 4 ? colors[score] : 'rgba(255,255,255,0.1)';
  lbl.textContent = labels[score] || 'Too weak';
  lbl.style.color = score > 0 ? colors[score] : '#94a3b8';
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  var f = e.target.elements;
  var btn = $('#auth-btn');
  btn.disabled = true; btn.textContent = 'Authenticating…';
  try {
    var payload = {
      fullname: f.fullname ? f.fullname.value.trim() : '',
      email: f.email.value.trim(),
      password: f.password.value,
      adminCode: f.adminCode ? f.adminCode.value.trim() : '',
      role: authRole
    };
    var d = await api('/' + authMode, 'POST', payload);
    token = d.token; me = d.user;
    localStorage.t = token; localStorage.me = JSON.stringify(me);
    render();
  } catch (err) {
    $('#auth-err').textContent = err.message;
    btn.disabled = false; btn.textContent = authMode === 'register' ? 'Create Account' : 'Sign In';
  }
}

            '<div class="widget-header">' + icons.ticket + ' Automatic FIFO Waitlist</div>' +
            '<p class="widget-desc">When events reach capacity, students join a live FIFO queue. If a confirmed student cancels, the first student in the queue is automatically promoted to a confirmed seat.</p>' +
          '</div>' +
        '</aside>' +
      '</div>' +
    '</main>' +

    '<div id="modal-container"></div>';

  loadEvents();
}

function setNav(n) { activeNav = n; renderMain(); }
function setTagFilter(t) { filterTag = t; renderGrid(); }
function handleSearch(q) { searchQuery = q.toLowerCase().trim(); renderGrid(); }

async function loadEvents() {
  try {
    cachedEvents = await api('/events');
    renderGrid();
  } catch (err) {
    toast(err.message, true);
  }
}

function renderGrid() {
  var filtered = cachedEvents.filter(function(e) {
    if (activeNav === 'bookmarks' && me.role !== 'admin') {
      if (!e.registered && !e.waitlisted) return false;
    }
    var matchSearch = !searchQuery || e.name.toLowerCase().includes(searchQuery) || (e.description && e.description.toLowerCase().includes(searchQuery));
    var matchTag = filterTag === 'ALL' || (e.tags && e.tags.some(function(t){ return t.toLowerCase() === filterTag.toLowerCase(); }));
    return matchSearch && matchTag;
  });

  var countEl = $('#event-stat-count');
  if (countEl) countEl.textContent = filtered.length + ' event' + (filtered.length !== 1 ? 's' : '') + ' available';

  var grid = $('#events-grid');
  if (!grid) return;

  if (filtered.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;background:var(--bg-surface);border-radius:var(--radius-xl);border:1px dashed var(--bd-card)">' +
      '<p style="font-size:17px;font-weight:800;color:#fff;margin-bottom:6px">' + (activeNav === 'bookmarks' ? 'You have no active passes yet' : 'No events found') + '</p>' +
      '<p style="font-size:13.5px;color:var(--tx-muted)">' + (activeNav === 'bookmarks' ? 'Explore events and RSVP or join waiting lists.' : 'Try adjusting your search criteria.') + '</p>' +
    '</div>';
  } else {
    grid.innerHTML = filtered.map(function(e, i) {
      var isFull = e.left <= 0;
      var bgImg = e.banner || DEFAULT_POSTERS[i % DEFAULT_POSTERS.length];
      var isAdmin = me.role === 'admin';

      var topBadgeHtml = '';
      if (e.registered) {
        topBadgeHtml = '<span class="pill-badge confirmed">' + icons.check + ' Confirmed</span>';
      } else if (e.waitlisted) {
        topBadgeHtml = '<span class="pill-badge wait">' + icons.clock + ' Waitlist #' + e.waitlistPosition + '</span>';
      } else if (e.hype > 0) {
        topBadgeHtml = '<span class="pill-badge hot">' + icons.fire + ' ' + e.hype + '</span>';
      } else {
        topBadgeHtml = '<span></span>';
      }

      var seatsBadgeHtml = '<span class="pill-badge ' + (isFull ? 'full' : 'seats') + '">' + (isFull ? 'FULL (' + e.waitlistCount + ' Waitlist)' : e.left + ' left') + '</span>';

      var actionButtonHtml = '';
      if (isAdmin) {
        actionButtonHtml = '<button class="card-quick-btn" style="background:#8b5cf6;color:#fff" onclick="openDetailModal(\'' + e.id + '\')">' + icons.users + ' Manage</button>';
      } else {
        if (e.registered) {
          actionButtonHtml = '<button class="card-quick-btn booked" onclick="cancelRegistration(\'' + e.id + '\')" title="Click to cancel registration">' + icons.check + ' Registered</button>';
        } else if (e.waitlisted) {
          actionButtonHtml = '<button class="card-quick-btn waitlist-btn" onclick="leaveWaitlist(\'' + e.id + '\')" title="Click to leave waiting list">' + icons.clock + ' Waitlist #' + e.waitlistPosition + '</button>';
        } else if (isFull) {
          actionButtonHtml = '<button class="card-quick-btn waitlist-btn" onclick="joinWaitlist(\'' + e.id + '\')">' + icons.plus + ' Join Waitlist</button>';
        } else {
          actionButtonHtml = '<button class="card-quick-btn" onclick="registerEvent(\'' + e.id + '\')">' + icons.ticket + ' Book Pass</button>';
        }
      }

      return '<div class="event-poster-card" onclick="openDetailModal(\'' + e.id + '\')">' +
        '<div class="event-poster-art" style="background-image:url(\'' + bgImg + '\')">' +
          '<div class="event-poster-overlay">' +
            '<div class="card-top-tags">' + topBadgeHtml + seatsBadgeHtml + '</div>' +
            '<div class="card-bottom-actions" onclick="event.stopPropagation()">' +
              actionButtonHtml +
              (!isAdmin ? '<button class="card-star-btn ' + (e.interested ? 'active' : '') + '" onclick="toggleInterest(\'' + e.id + '\')">' + icons.star + '</button>' : '') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="event-info-box">' +
          '<div class="event-name" title="' + esc(e.name) + '">' + esc(e.name) + '</div>' +
          '<div class="event-sub-meta">' +
            '<span>' + esc(e.date) + '</span>' +
            '<span>•</span>' +
            '<span>' + esc(e.time) + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // Leaderboard
  var board = $('#leaderboard-list');
  if (board) {
    var topEvents = cachedEvents.slice().sort(function(a,b){ return b.hype - a.hype; }).slice(0, 4);
    board.innerHTML = topEvents.map(function(e, idx) {
      var thumb = e.banner || DEFAULT_POSTERS[idx % DEFAULT_POSTERS.length];
      var rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
      return '<div class="leaderboard-item" onclick="openDetailModal(\'' + e.id + '\')" style="cursor:pointer">' +
        '<span class="rank-num ' + rankClass + '">' + (idx + 1) + '</span>' +
        '<div class="rank-thumb" style="background-image:url(\'' + thumb + '\')"></div>' +
        '<div class="rank-meta">' +
          '<div class="rank-name">' + esc(e.name) + '</div>' +
          '<div class="rank-date">' + esc(e.date) + ' • ' + (e.left <= 0 ? 'Full' : e.left + ' seats') + '</div>' +
          '<div class="rank-hype">' + icons.fire + ' ' + (e.hype || 0) + ' Interested</div>' +
        '</div>' +
      '</div>';
    }).join('') || '<p style="color:var(--tx-muted);font-size:13px">No ranked events yet</p>';
  }
}

/* ── Actions ── */
async function registerEvent(id) {
  try {
    await api('/events/' + id + '/register', 'POST');
    toast('RSVP successful! Your pass is confirmed.');
    loadEvents();
  } catch(err) {
    toast(err.message, true);
  }
}

async function joinWaitlist(id) {
  try {
    var res = await api('/events/' + id + '/waitlist', 'POST');
    toast('Added to waiting list! You are position #' + (res.waitlistPosition || '1'));
    loadEvents();
  } catch(err) {
    toast(err.message, true);
  }
}

async function cancelRegistration(id) {
  if (!confirm('Are you sure you want to cancel your confirmed pass? If there is a waiting list, the first student will be promoted.')) return;
  try {
    var res = await api('/events/' + id + '/cancel', 'POST');
    toast('Registration cancelled. ' + (res.promoted ? 'Next waitlisted student promoted!' : ''));
    closeModal();
    loadEvents();
  } catch(err) {
    toast(err.message, true);
  }
}

async function leaveWaitlist(id) {
  if (!confirm('Do you want to leave the waiting list?')) return;
  try {
    await api('/events/' + id + '/leave-waitlist', 'POST');
    toast('Removed from waiting list');
    closeModal();
    loadEvents();
  } catch(err) {
    toast(err.message, true);
  }
}

async function toggleInterest(id) {
  try {
    await api('/events/' + id + '/interest', 'POST');
    loadEvents();
  } catch(err) {
    toast(err.message, true);
  }
}

async function deleteEvent(id) {
  if (!confirm('Permanently delete this event? This action cannot be undone.')) return;
  try {
    await api('/events/' + id, 'DELETE');
    toast('Event deleted');
    closeModal();
    loadEvents();
  } catch(err) {
    toast(err.message, true);
  }
}

async function markAttendance(eventId, userId, status) {
  try {
    var updated = await api('/events/' + eventId + '/attendance', 'POST', { userId: userId, status: status });
    toast('Attendance marked: ' + status.toUpperCase());
    var idx = cachedEvents.findIndex(function(x){ return x.id === eventId; });
    if (idx !== -1) cachedEvents[idx] = updated;
    openDetailModal(eventId);
    renderGrid();
  } catch(err) {
    toast(err.message, true);
  }
}

/* ── Modal Manager ── */
function closeModal() {
  var mc = $('#modal-container');
  if (mc) mc.innerHTML = '';
}

function setAdminTab(tab, eventId) {
  activeAdminTab = tab;
  openDetailModal(eventId);
}

function openDetailModal(id) {
  var e = cachedEvents.find(function(x){ return x.id === id; });
  if (!e) return;
  var isAdmin = me.role === 'admin';
  var isFull = e.left <= 0;
  var pct = Math.min(100, Math.round(e.taken / e.seats * 100));
  var bg = e.banner || DEFAULT_POSTERS[0];

  var adminSectionHtml = '';
  if (isAdmin) {
    var stats = e.attendanceStats || { total: e.taken, attended: 0, absent: 0, unmarked: e.taken };
    var attendeesList = e.attendees || [];
    var waitQueue = e.waitlistQueue || [];

    adminSectionHtml =
      '<div style="margin-top:24px;border-top:1px solid var(--bd-card-strong);padding-top:20px">' +
        '<div class="modal-tabs-bar">' +
          '<button class="modal-tab-btn ' + (activeAdminTab === 'attendees' ? 'active' : '') + '" onclick="setAdminTab(\'attendees\',\'' + e.id + '\')">' + icons.users + ' Attendees (' + attendeesList.length + ')</button>' +
          '<button class="modal-tab-btn ' + (activeAdminTab === 'waitlist' ? 'active' : '') + '" onclick="setAdminTab(\'waitlist\',\'' + e.id + '\')">' + icons.clock + ' FIFO Waitlist (' + waitQueue.length + ')</button>' +
        '</div>' +

        (activeAdminTab === 'attendees'
          ? '<div>' +
              '<div class="attendance-summary-bar">' +
                '<div class="att-stat-box"><div class="att-stat-val" style="color:#c4b5fd">' + stats.total + '</div><div class="att-stat-lbl">Registered</div></div>' +
                '<div class="att-stat-box"><div class="att-stat-val" style="color:#10b981">' + stats.attended + '</div><div class="att-stat-lbl">Attended</div></div>' +
                '<div class="att-stat-box"><div class="att-stat-val" style="color:#f43f5e">' + stats.absent + '</div><div class="att-stat-lbl">Absent</div></div>' +
                '<div class="att-stat-box"><div class="att-stat-val" style="color:#cbd5e1">' + stats.unmarked + '</div><div class="att-stat-lbl">Unmarked</div></div>' +
              '</div>' +
              '<div style="max-height:230px;overflow-y:auto;margin-bottom:18px">' +
                (attendeesList.length ? attendeesList.map(function(u){
                  var isAtt = u.attendance === 'attended';
                  var isAbs = u.attendance === 'absent';
                  return '<div class="attendee-row">' +
                    '<div>' +
                      '<div style="font-weight:800;font-size:13.5px;color:#fff">' + esc(u.name) + '</div>' +
                      '<div style="font-size:12px;color:var(--tx-muted)">' + esc(u.email) + '</div>' +
                    '</div>' +
                    '<div class="att-btn-group">' +
                      '<button class="att-toggle-btn ' + (isAtt ? 'is-attended' : '') + '" onclick="markAttendance(\'' + e.id + '\',\'' + u.id + '\',\'attended\')">✓ Attended</button>' +
                      '<button class="att-toggle-btn ' + (isAbs ? 'is-absent' : '') + '" onclick="markAttendance(\'' + e.id + '\',\'' + u.id + '\',\'absent\')">✕ Absent</button>' +
                      '<button class="att-toggle-btn" onclick="markAttendance(\'' + e.id + '\',\'' + u.id + '\',\'unmarked\')" title="Reset">↺</button>' +
                    '</div>' +
                  '</div>';
                }).join('') : '<p style="font-size:13.5px;color:var(--tx-muted);text-align:center;padding:22px">No registered students yet.</p>') +
              '</div>' +
            '</div>'
          : '<div>' +
              '<div style="background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.4);padding:12px 16px;border-radius:var(--radius-md);margin-bottom:14px;font-size:13px;color:#fde68a;line-height:1.4">' +
                'ℹ️ <b>First-Come, First-Served Queue:</b> When any confirmed attendee cancels, Position #1 is automatically promoted.' +
              '</div>' +
              '<div style="max-height:230px;overflow-y:auto;margin-bottom:18px">' +
                (waitQueue.length ? waitQueue.map(function(w){
                  return '<div class="waitlist-queue-item">' +
                    '<div>' +
                      '<span style="font-size:11.5px;font-weight:900;background:#f59e0b;color:#000;padding:3px 7px;border-radius:4px;margin-right:8px">#' + w.position + '</span>' +
                      '<span style="font-weight:800;font-size:13.5px;color:#fff">' + esc(w.name) + '</span>' +
                      '<div style="font-size:12px;color:var(--tx-muted);margin-left:32px">' + esc(w.email) + '</div>' +
                    '</div>' +
                    '<span style="font-size:11.5px;color:var(--tx-dim);font-weight:700">Queue Priority</span>' +
                  '</div>';
                }).join('') : '<p style="font-size:13.5px;color:var(--tx-muted);text-align:center;padding:22px">Waiting list is currently empty.</p>') +
              '</div>' +
            '</div>'
        ) +
        '<button class="submit-btn" style="background:#dc2626" onclick="deleteEvent(\'' + e.id + '\')">' + icons.trash + ' Delete Event</button>' +
      '</div>';
  }

  var studentActionsHtml = '';
  if (!isAdmin) {
    if (e.registered) {
      studentActionsHtml =
        '<div style="background:rgba(16,185,129,0.15);border:1.5px solid rgba(16,185,129,0.4);padding:14px;border-radius:var(--radius-md);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">' +
          '<div style="font-size:13.5px;font-weight:800;color:#34d399">' + icons.check + ' You hold a confirmed seat pass!' + (e.attendance && e.attendance !== 'unmarked' ? ' (' + e.attendance.toUpperCase() + ')' : '') + '</div>' +
          '<button style="background:#ef4444;color:#fff;border:0;padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:800;cursor:pointer" onclick="cancelRegistration(\'' + e.id + '\')">Cancel Pass</button>' +
        '</div>';
    } else if (e.waitlisted) {
      studentActionsHtml =
        '<div style="background:rgba(245,158,11,0.15);border:1.5px solid rgba(245,158,11,0.4);padding:14px;border-radius:var(--radius-md);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">' +
          '<div style="font-size:13.5px;font-weight:800;color:#fbbf24">' + icons.clock + ' You are in Waiting List position #' + e.waitlistPosition + '</div>' +
          '<button style="background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.25);padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:800;cursor:pointer" onclick="leaveWaitlist(\'' + e.id + '\')">Leave Waitlist</button>' +
        '</div>';
    } else if (isFull) {
      studentActionsHtml =
        '<div style="display:flex;gap:12px">' +
          '<button class="submit-btn" style="flex:2;background:#f59e0b;color:#000" onclick="joinWaitlist(\'' + e.id + '\')">' + icons.clock + ' Join Waiting List (' + e.waitlistCount + ' waiting)</button>' +
          '<button class="card-star-btn ' + (e.interested ? 'active' : '') + '" style="flex:1;height:auto;border-radius:var(--radius-md)" onclick="toggleInterest(\'' + e.id + '\')">' + icons.star + ' ' + (e.interested ? 'Hyped' : 'Hype') + '</button>' +
        '</div>';
    } else {
      studentActionsHtml =
        '<div style="display:flex;gap:12px">' +
          '<button class="submit-btn" style="flex:2" onclick="registerEvent(\'' + e.id + '\')">' + icons.ticket + ' Book Pass Now</button>' +
          '<button class="card-star-btn ' + (e.interested ? 'active' : '') + '" style="flex:1;height:auto;border-radius:var(--radius-md)" onclick="toggleInterest(\'' + e.id + '\')">' + icons.star + ' ' + (e.interested ? 'Hyped' : 'Hype') + '</button>' +
        '</div>';
    }
  }

  $('#modal-container').innerHTML =
    '<div class="modal-backdrop" onclick="closeModal()">' +
      '<div class="modal-window" onclick="event.stopPropagation()">' +
        '<button class="modal-close-btn" onclick="closeModal()">' + icons.close + '</button>' +
        '<div style="height:190px;border-radius:var(--radius-lg);background-image:url(\'' + bg + '\');background-size:cover;background-position:center;margin-bottom:22px;position:relative;border:1px solid var(--bd-card-strong)">' +
          '<span class="pill-badge ' + (isFull ? 'full' : 'seats') + '" style="position:absolute;bottom:12px;left:12px">' + (isFull ? 'FULL (' + e.waitlistCount + ' in Waitlist)' : e.left + ' seats available') + '</span>' +
        '</div>' +
        '<h2 style="font-size:24px;font-weight:900;margin-bottom:8px">' + esc(e.name) + '</h2>' +
        '<div style="display:flex;gap:14px;font-size:13.5px;font-weight:600;color:var(--tx-muted);margin-bottom:18px;flex-wrap:wrap">' +
          '<span>' + icons.calendar + ' ' + esc(e.date) + '</span>' +
          '<span>•</span>' +
          '<span>' + esc(e.time) + '</span>' +
          '<span>•</span>' +
          '<span>' + icons.fire + ' ' + e.hype + ' Interested</span>' +
        '</div>' +
        (e.tags && e.tags.length ? '<div class="tag-input-row" style="margin-bottom:18px">' + e.tags.map(function(t){ return '<span class="chip-tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
        (e.description ? '<p style="font-size:14.5px;color:var(--tx-body);line-height:1.6;margin-bottom:22px">' + esc(e.description) + '</p>' : '') +
        '<div style="background:var(--bg-input);padding:16px;border-radius:var(--radius-md);margin-bottom:22px;border:1px solid var(--bd-card)">' +
          '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--tx-muted);margin-bottom:9px">' +
            '<span>Occupancy</span>' +
            '<span>' + e.taken + ' / ' + e.seats + ' booked (' + pct + '%)</span>' +
          '</div>' +
          '<div style="height:7px;background:rgba(255,255,255,0.12);border-radius:9999px;overflow:hidden">' +
            '<div style="width:' + pct + '%;height:100%;background:linear-gradient(90deg,#8b5cf6,#f43f5e);border-radius:9999px"></div>' +
          '</div>' +
        '</div>' +
        studentActionsHtml +
        adminSectionHtml +
      '</div>' +
    '</div>';
}

function openAdminCreateModal() {
  newTags = [];
  newBanner = DEFAULT_POSTERS[0];

  $('#modal-container').innerHTML =
    '<div class="modal-backdrop" onclick="closeModal()">' +
      '<div class="modal-window" onclick="event.stopPropagation()">' +
        '<button class="modal-close-btn" onclick="closeModal()">' + icons.close + '</button>' +
        '<h2 style="font-size:24px;font-weight:900;margin-bottom:6px">Publish Campus Event</h2>' +
        '<p style="font-size:13.5px;color:var(--tx-muted);margin-bottom:22px">Create and broadcast an event with automatic FIFO waitlist support.</p>' +
        '<form onsubmit="handleCreateEvent(event)">' +
          '<div class="form-field"><label>Event Title</label><input class="dark-input" name="title" placeholder="e.g. Annual AI & Hackathon 2026" required></div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
            '<div class="form-field"><label>Date</label><input class="dark-input" name="date" type="date" required></div>' +
            '<div class="form-field"><label>Time</label><input class="dark-input" name="time" type="time" required></div>' +
          '</div>' +
          '<div class="form-field"><label>Seat Capacity</label><input class="dark-input" name="seats" type="number" min="1" placeholder="50" required></div>' +
          '<div class="form-field"><label>Description</label><textarea class="dark-input" name="description" rows="3" placeholder="Keynotes, agenda, prizes, campus hall..."></textarea></div>' +
          '<div class="form-field"><label>Tags (Press Enter)</label>' +
            '<input class="dark-input" id="tag-input" onkeydown="handleTagKey(event)" placeholder="e.g. Coding, AI, Free">' +
            '<div class="tag-input-row" id="tag-chips-box"></div>' +
          '</div>' +
          '<div class="form-field"><label>Choose High-Stock Artwork</label>' +
            '<div class="preset-posters-row">' +
              DEFAULT_POSTERS.map(function(p, i){
                return '<div class="preset-poster-thumb ' + (i === 0 ? 'selected' : '') + '" style="background-image:url(\'' + p + '\')" onclick="selectPresetBanner(\'' + p + '\', this)"></div>';
              }).join('') +
            '</div>' +
            '<div style="margin-top:12px"><input type="file" accept="image/*" onchange="handleFileUpload(this.files[0])" style="font-size:13px;color:var(--tx-muted)"></div>' +
          '</div>' +
          '<button class="submit-btn" id="create-btn" style="margin-top:22px">' + icons.plus + ' Publish Event</button>' +
        '</form>' +
      '</div>' +
    '</div>';
}

function selectPresetBanner(url, el) {
  newBanner = url;
  document.querySelectorAll('.preset-poster-thumb').forEach(function(item){ item.classList.remove('selected'); });
  if (el) el.classList.add('selected');
}

function handleTagKey(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    var val = e.target.value.trim();
    if (val && newTags.length < 6 && !newTags.includes(val)) {
      newTags.push(val);
      drawAdminTags();
    }
    e.target.value = '';
  }
}

function drawAdminTags() {
  var box = $('#tag-chips-box');
  if (!box) return;
  box.innerHTML = newTags.map(function(t, i){
    return '<span class="chip-tag">' + esc(t) + '<b onclick="newTags.splice(' + i + ',1);drawAdminTags()">×</b></span>';
  }).join('');
}

function handleFileUpload(file) {
  if (!file) return;
  var im = new Image();
  im.onload = function() {
    var canvas = document.createElement('canvas');
    var maxDim = 900;
    var scale = Math.min(1, maxDim / Math.max(im.width, im.height));
    canvas.width = im.width * scale;
    canvas.height = im.height * scale;
    canvas.getContext('2d').drawImage(im, 0, 0, canvas.width, canvas.height);
    newBanner = canvas.toDataURL('image/jpeg', 0.85);
    toast('Custom poster uploaded!');
  };
  im.src = URL.createObjectURL(file);
}

async function handleCreateEvent(e) {
  e.preventDefault();
  var f = e.target.elements;
  var btn = $('#create-btn');
  btn.disabled = true; btn.textContent = 'Publishing…';
  try {
    await api('/events', 'POST', {
      name: f.title.value.trim(),
      date: f.date.value,
      time: f.time.value,
      seats: f.seats.value,
      description: f.description.value.trim(),
      tags: newTags,
      banner: newBanner
    });
    toast('Event published successfully!');
    closeModal();
    loadEvents();
  } catch(err) {
    toast(err.message, true);
    btn.disabled = false; btn.textContent = 'Publish Event';
  }
}

render();
</script>
